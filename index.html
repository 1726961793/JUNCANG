<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菌仓控制器</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 MQTT.js 库 - 必须加载 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
</head>
<body>
    <!-- 标题 -->
    <div class="card">
        <div class="title">
            🧫 菌仓控制器
            <span id="badge" class="badge off">离线</span>
            <span id="modeBadge" class="mode-badge auto">自动</span>
        </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <span id="deviceName">🌐 远程控制</span>
        <span id="mqttStatus">MQTT:--</span>
        <span id="sensorStatus">传感器:--</span>
    </div>

    <!-- 实时数据 -->
    <div class="card">
        <div class="section-title">📊 实时数据</div>
        <div class="sensor-grid">
            <div class="sensor-item">
                <div class="lbl">🌡️ 温度</div>
                <div class="val"><span id="st">--</span>℃</div>
            </div>
            <div class="sensor-item">
                <div class="lbl">💧 湿度</div>
                <div class="val"><span id="sh">--</span>%</div>
            </div>
            <div class="sensor-item">
                <div class="lbl">🫧 CO₂</div>
                <div class="val"><span id="sc">--</span>ppm</div>
            </div>
        </div>
        <div style="text-align:center;font-size:12px;color:#a0aec0;margin-top:6px;">
            最后更新: <span id="lastUpdate">--</span>
        </div>
    </div>

    <!-- 控制模式 -->
    <div class="card">
        <div class="section-title">🎮 控制模式</div>
        <div class="row">
            <button class="btn btn-auto" id="autoBtn">🤖 自动</button>
            <button class="btn btn-manual" id="manualBtn">✋ 手动</button>
        </div>
        <div style="font-size:13px;color:#718096;text-align:center;margin-top:6px">
            当前: <strong id="modeDisplay" style="color:#2d3748;">自动</strong>
        </div>
    </div>

    <!-- 执行器 -->
    <div class="card">
        <div class="section-title">🔌 执行器</div>
        <div class="relay-grid">
            <div class="relay-item off" id="r-cool">
                <div class="icon">❄️</div>
                <div class="name">降温</div>
                <div class="status">○ 关闭</div>
                <div class="btns">
                    <button class="btn btn-on" onclick="controlRelay('cool',1)">开</button>
                    <button class="btn btn-off" onclick="controlRelay('cool',0)">关</button>
                </div>
            </div>
            <div class="relay-item off" id="r-fan">
                <div class="icon">🌀</div>
                <div class="name">换气</div>
                <div class="status">○ 关闭</div>
                <div class="btns">
                    <button class="btn btn-on" onclick="controlRelay('fan',1)">开</button>
                    <button class="btn btn-off" onclick="controlRelay('fan',0)">关</button>
                </div>
            </div>
            <div class="relay-item off" id="r-humi">
                <div class="icon">💦</div>
                <div class="name">加湿</div>
                <div class="status">○ 关闭</div>
                <div class="btns">
                    <button class="btn btn-on" onclick="controlRelay('humi',1)">开</button>
                    <button class="btn btn-off" onclick="controlRelay('humi',0)">关</button>
                </div>
            </div>
            <div class="relay-item off" id="r-heat">
                <div class="icon">🔥</div>
                <div class="name">加热</div>
                <div class="status">○ 关闭</div>
                <div class="btns">
                    <button class="btn btn-on" onclick="controlRelay('heat',1)">开</button>
                    <button class="btn btn-off" onclick="controlRelay('heat',0)">关</button>
                </div>
            </div>
        </div>
        <div class="hint">💡 手动模式下可单独控制</div>
    </div>

    <!-- 参数设置 -->
    <div class="card">
        <div class="section-title">⚙️ 参数设置</div>
        <div class="param-row">
            <label>🌡️温度</label>
            <input type="number" id="tMin" step="0.1" value="20.0">
            <span class="sep">~</span>
            <input type="number" id="tMax" step="0.1" value="25.0">
            <span style="font-size:12px;color:#a0aec0;">℃</span>
        </div>
        <div class="param-row">
            <label>💧湿度</label>
            <input type="number" id="hMin" step="1" value="65">
            <span class="sep">~</span>
            <input type="number" id="hMax" step="1" value="75">
            <span style="font-size:12px;color:#a0aec0;">%</span>
        </div>
        <div class="param-row">
            <label>🫧CO₂</label>
            <input type="number" id="cMin" step="50" value="500">
            <span class="sep">~</span>
            <input type="number" id="cMax" step="50" value="1000">
            <span style="font-size:12px;color:#a0aec0;">ppm</span>
        </div>
        <div class="row" style="margin-top:4px;">
            <button class="btn btn-auto" onclick="setParams()">📤 应用参数</button>
            <button class="btn btn-refresh" onclick="resetDefault()">↺ 恢复默认</button>
        </div>
    </div>

    <!-- 远程控制 -->
    <div class="card">
        <div class="section-title">☁️ 远程控制</div>
        <div style="font-size:13px;color:#4a5568;margin-bottom:8px;">
            <span id="remoteStatus">状态: 未连接</span>
        </div>
        <div class="row">
            <button class="btn btn-auto" onclick="sendCommand('AUTO')">🤖 自动模式</button>
            <button class="btn btn-manual" onclick="sendCommand('MANUAL')">✋ 手动模式</button>
        </div>
        <div class="row" style="margin-top:6px;">
            <button class="btn btn-on" onclick="sendCommand('M:cool,1')">❄️ 开降温</button>
            <button class="btn btn-off" onclick="sendCommand('M:cool,0')">❄️ 关降温</button>
        </div>
        <div class="row" style="margin-top:6px;">
            <button class="btn btn-on" onclick="sendCommand('M:fan,1')">🌀 开换气</button>
            <button class="btn btn-off" onclick="sendCommand('M:fan,0')">🌀 关换气</button>
        </div>
        <div class="row" style="margin-top:6px;">
            <button class="btn btn-on" onclick="sendCommand('M:humi,1')">💦 开加湿</button>
            <button class="btn btn-off" onclick="sendCommand('M:humi,0')">💦 关加湿</button>
        </div>
        <div class="row" style="margin-top:6px;">
            <button class="btn btn-on" onclick="sendCommand('M:heat,1')">🔥 开加热</button>
            <button class="btn btn-off" onclick="sendCommand('M:heat,0')">🔥 关加热</button>
        </div>
        <div class="row" style="margin-top:6px;">
            <button class="btn btn-refresh" onclick="sendCommand('STATUS')">📊 请求状态</button>
        </div>
        <div class="hint">📱 通过巴法云 MQTT 远程控制</div>
    </div>

    <!-- 日志 -->
    <div class="card">
        <div class="section-title">📝 操作日志</div>
        <div class="log" id="log">[系统] 就绪</div>
    </div>

    <div class="footer">菌仓控制器 v2.0 | 数据自动刷新</div>

    <script src="app.js"></script>
</body>
</html>
